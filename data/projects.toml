# Projects on the home page, shown in this order.
# To add one, copy a [[project]] block. Any field can be left out.
# A link with an empty url shows up as a red TODO.
# summary: the 1-2 sentence write-up shown on the card. highlights: hidden under a "Highlights" toggle.
# image: path under static/. It is cropped to a 4:3 tile; focus picks which part stays
# (CSS object-position, e.g. "left top", default centre). fit = "contain" shows the whole
# image on a plain tile instead (good for logos). No image shows the first letter of the name.
# video: path under static/ (e.g. "videos/bingus.mp4"). The image shows until the card is
# hovered, then the video fades in over it, cropped to the same square, and plays muted on
# loop. It only downloads on first hover.
# media_url: makes the image clickable, opening this link in a new tab.

[[project]]
name = "Edgewise"
image = "images/edgewise-bfs.svg"
fit = "contain"
media_url = "https://github.com/Legalunicorn/edgewise"
dates = "Oct 2026 – present"
stack = ["C++20", "Multithreading", "CMake", "GoogleTest"]
summary = "A C++20 library of parallel graph algorithms (BFS, PageRank, connected components) built on persistent worker threads and a CAS-based union-find. Up to 4.4× faster than sequential on million-vertex graphs."
highlights = [
  "Parallel connected components ran 3.40× and 2.06× faster than sequential union-find on SNAP road and YouTube graphs (1.1M–2.0M vertices).",
  "Parallel BFS and PageRank ran 4.1× and 4.4× faster on generated 1.5M-vertex graphs.",
  "Persistent worker threads, barrier synchronization and a CAS-based concurrent union-find on shared CSR storage.",
  "GoogleTest suite runs under ThreadSanitizer in GitHub Actions CI.",
]
links = [
  { name = "Docs", url = "https://legalunicorn.github.io/edgewise/" },
  { name = "GitHub", url = "https://github.com/Legalunicorn/edgewise" },
]

