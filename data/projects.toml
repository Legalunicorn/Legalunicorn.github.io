[[project]]
name = "CafeGame (NUS Orbital, Apollo 11)"
image = "images/cafegame.png"
video = "videos/cafegame.mp4"
media_url = "https://hiroc.itch.io/ms3sub"
dates = "May 2026 – Aug 2026"
stack = ["Unity", "C#", "Aseprite"]
summary = "2D cat cafe simulation game in Unity, built with a teammate. I implemented A* pathfinding that moves NPCs around the cafe, and designed the cafe, character and UI assets."
highlights = [
  "A* pathfinding on a hand-placed node graph, used by both customers and cats.",
  "Singleton managers for shared game state, and state machines for customer and cat behaviour.",
  "Cat requests extend a shared base class, and foods and cats are defined as data, so new types are quick to add.",
  "Three levels of rising difficulty, a shop for new cats and cafe customisation, and an interactive tutorial.",
  "Unit tests with Unity Test Framework and a feature-branch Git workflow.",
]
links = [
  { name = "Demo", url = "https://hiroc.itch.io/ms3sub" },
]

[[project]]
name = "NUS Prerequisite Graph"
image = "images/prereq-graph.png"
media_url = "https://hiroc.dev/nus-prereq-graph/"
dates = "Jul 2026 – present"
stack = ["TypeScript", "React", "Cytoscape.js", "Claude Code", "Codex"]
summary = "Plans NUS modules as a prerequisite graph built from NUSMods data. Each module shows the fewest semesters needed to reach it."
highlights = [
  "Fewest semesters is dynamic programming over the prerequisite graph, memoised so each module is worked out once, with a guard against cycles.",
  "\"Longest paths\" traces back the chain that sets that number, like a critical path.",
  "Counts semesters spent waiting when a module is only offered in Sem 1 or Sem 2.",
]
links = [
  { name = "Live", url = "https://hiroc.dev/nus-prereq-graph/" },
  { name = "GitHub", url = "https://github.com/Legalunicorn/nus-prereq-graph" },
]
